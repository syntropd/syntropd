name: Sync AGENTS.md Across Org

on:
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
  workflow_dispatch:

jobs:
  sync-agents:
    name: Fan-out AGENTS.md
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4

      - name: Distribute AGENTS.md to all Org Repos
        env:
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          REPOS=(
            "sentry"
            "runtimed"
            "inferenced"
            "modeld"
            "contextd"
            "toold"
            "routerd"
            "syntropctl"
            "syntropd.github.io"
          )

          echo "Starting AGENTS.md sync across syntropd organization..."

          gh auth setup-git

          for repo in "${REPOS[@]}"; do
            echo "----------------------------------------"
            echo "Syncing target: syntropd/$repo"
            tmp_dir=$(mktemp -d)

            if gh repo clone "syntropd/$repo" "$tmp_dir" -- --depth=1; then
              cp AGENTS.md "$tmp_dir/AGENTS.md"

              pushd "$tmp_dir" > /dev/null

              if ! git diff --quiet AGENTS.md; then
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add AGENTS.md
                git commit -m "chore(sync): update AGENTS.md from syntropd/syntropd"
                git push origin main
                echo "✓ Successfully updated syntropd/$repo"
              else
                echo "✓ syntropd/$repo is already up to date."
              fi

              popd > /dev/null
            else
              echo "✗ Failed to clone syntropd/$repo"
            fi

            rm -rf "$tmp_dir"
          done

          echo "----------------------------------------"
          echo "Org-wide sync complete."
