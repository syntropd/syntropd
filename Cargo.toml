[package]
name = "syntropd"
version = "0.3.6"
edition = "2021"
rust-version = "1.80.0"
description = "Native AI Subsystem for systemd — Umbrella Meta-Package & Supervisor"
license = "Apache-2.0"
repository = "https://github.com/syntropd/syntropd"
homepage = "https://syntropd.github.io"
documentation = "https://syntropd.github.io"
readme = "README.md"
keywords = ["systemd", "ai", "varlink", "cgroups", "subsystem"]
categories = ["command-line-utilities", "os::unix-apis"]

[lib]
name = "syntropd"
path = "src/lib.rs"

[[bin]]
name = "syntropd"
path = "src/main.rs"

[features]
default = []
all = [
    "inferenced",
    "modeld",
    "contextd",
    "toold",
    "runtimed",
    "sentry",
    "routerd",
    "syntropctl",
]
inferenced = ["dep:syntrop-inferenced"]
modeld = ["dep:syntrop-modeld"]
contextd = ["dep:syntrop-contextd"]
toold = ["dep:syntrop-toold"]
runtimed = ["dep:syntrop-runtimed"]
sentry = ["dep:syntrop-sentry"]
routerd = ["dep:syntrop-routerd"]
syntropctl = ["dep:syntropctl"]

[dependencies]
# Standardized syntrop-* suite dependencies
syntrop-toold = { version = "0.3.0", path = "../toold/crates/toold-daemon", optional = true }
syntrop-runtimed = { version = "0.3.0", path = "../runtimed/crates/runtimed-daemon", optional = true }
syntrop-inferenced = { version = "0.3.0", path = "../inferenced/crates/inferenced-daemon", optional = true }
syntrop-contextd = { version = "0.3.0", path = "../contextd/crates/contextd-daemon", optional = true }
syntrop-modeld = { version = "0.3.0", path = "../modeld/crates/modeld-daemon", optional = true }
syntrop-sentry = { version = "0.3.0", path = "../sentry/crates/sentry-daemon", optional = true }
syntrop-routerd = { version = "0.3.0", path = "../routerd/crates/routerd-daemon", optional = true }
syntropctl = { version = "0.3.0", path = "../syntropctl/crates/syntropctl-cli", optional = true }

# Pure Rust system dependencies (zero C dynamic libs outside libc)
anyhow = "1.0.86"
clap = { version = "4.5", features = ["derive", "env"] }
rustix = { version = "0.38", features = ["fs", "net", "process", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
# Thin LTO + stripped symbols: smaller, faster binaries, portable x86-64.
lto = "thin"
strip = true

